name: Validate workspace configuration

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate JSON files
        run: |
          for f in .devcontainer/*/devcontainer.json config/presets/*.json .vscode/*.json; do
            python -m json.tool "$f" >/dev/null && echo "ok: $f"
          done

      - name: Validate presets
        run: python scripts/lab_config.py check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check bash can read every preset
        run: bash tests/preset_parsing.sh

      - name: Validate shell syntax
        run: |
          for f in scripts/*.sh tests/*.sh; do
            bash -n "$f" && echo "ok: $f"
          done

      - name: Validate Docker Compose configuration
        run: docker compose -f .devcontainer/docker-compose.yml config --quiet
