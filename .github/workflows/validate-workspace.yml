name: Validate workspace configuration

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate JSON configuration
        run: |
          python -m json.tool .devcontainer/devcontainer.json >/dev/null
          python -m json.tool config/apps.json >/dev/null

      - name: Validate bootstrap shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: Validate app manifest
        run: |
          python - <<'PY'
          import json
          import re
          from urllib.parse import urlparse

          with open("config/apps.json", encoding="utf-8") as f:
              config = json.load(f)

          apps = config.get("apps")
          assert isinstance(apps, list), "'apps' must be a list"
          names = set()

          for app in apps:
              assert isinstance(app, dict), "Each app entry must be an object"
              if not app.get("enabled", False):
                  continue

              name = app.get("name", "")
              repository = app.get("repository", "")
              branch = app.get("branch", "")
              assert re.fullmatch(r"[A-Za-z0-9_-]+", name), f"Invalid app name: {name!r}"
              assert name not in names, f"Duplicate enabled app: {name}"
              names.add(name)

              parsed = urlparse(repository)
              assert parsed.scheme == "https" and parsed.netloc, f"Invalid HTTPS repository for {name}"
              assert isinstance(branch, str) and branch.strip(), f"Missing branch for {name}"

          assert names, "Enable at least one app for the default workspace"
          print(f"Validated {len(names)} enabled app(s).")
          PY

      - name: Validate Docker Compose configuration
        run: docker compose -f .devcontainer/docker-compose.yml config --quiet
